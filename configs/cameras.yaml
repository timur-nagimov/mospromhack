# Камеры сервиса «Зазеркалье». Файл меняет API (/api/cameras), правки руками тоже допустимы.
# source.uri для file/images: абсолютный путь или относительно GUARD_DATA_DIR.
# Полигоны зон — нормированные координаты 0..1; active_hours — по Europe/Moscow.
# Демо (режим local): ролики и зоны A5 — data/videos/sN_0M.mp4, data/labels/sN_0M.json.
cameras:
- camera_id: cam_s1
  name: Цех 1, ограждённый сектор
  site: Цех 1
  source: {type: file, uri: videos/s1_01.mp4, loop: true, realtime: true}
  sample_fps: 5.0
  enabled: true
  zones:
  - zone_id: behind_tape
    name: За ограничительной лентой
    kind: danger
    polygon: [[0.0, 0.3], [0.07, 0.31], [0.4, 0.7], [0.22, 1.0], [0.0, 1.0]]
    active_hours: null
  rules:
  - rule_id: s1_tape
    type: zone_intrusion
    enabled: true
    zones: [behind_tape]
    params: {min_conf: 0.5, min_box_h_px: 40}
    min_duration_s: 2.0
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 5.0
    severity: high
- camera_id: cam_s2
  name: Проходная цеха, контроль СИЗ
  site: Цех 2
  source: {type: file, uri: videos/s2_01.mp4, loop: true, realtime: true}
  sample_fps: 5.0
  enabled: true
  zones: []
  rules:
  - rule_id: s2_ppe
    type: ppe_missing
    enabled: true
    zones: null
    params: {required: [helmet], min_box_h_px: 60}
    min_duration_s: 1.5
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 10.0
    severity: high
- camera_id: cam_s3
  name: Комната отдыха персонала
  site: АБК
  source: {type: file, uri: videos/s3_02.mp4, loop: true, realtime: true}
  sample_fps: 5.0
  enabled: true
  zones: []
  rules:
  - rule_id: s3_fall
    type: fall_immobile
    enabled: true
    zones: null
    params: {min_lying_s: 1.0, immobile_window_s: 1.5}
    min_duration_s: 1.0
    min_ratio: 0.5
    close_after_s: 3.0
    cooldown_s: 10.0
    severity: critical
- camera_id: cam_s4
  name: Погрузочная площадка
  site: Склад
  source: {type: file, uri: videos/s4_02.mp4, loop: true, realtime: true}
  sample_fps: 5.0
  enabled: true
  zones: []
  rules:
  - rule_id: s4_vehicle
    type: vehicle_proximity
    enabled: true
    zones: null
    params: {min_vehicle_speed_bh: 0.05}
    min_duration_s: 1.5
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 10.0
    severity: critical
