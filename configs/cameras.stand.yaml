# Камеры edge-узла на стенде LinQ (A10, D-005). Запуск на сервере стенда:
#   ~/guard311/bin/python -m guard.edge --config configs/cameras.stand.yaml
# (tools/stand.py start делает именно это; OMP_NUM_THREADS=2, GUARD_BACKEND=linq-tpu.)
#
# camera_id, зоны и правила те же, что в configs/cameras.yaml (демо A3, параметры A9 от 24.10 11:20):
# gateway на ноутбуке показывает эти камеры по своему конфигу, а frame_meta и события приходят с edge.
# Отличие одно: min_conf zone_intrusion на 0.05 ниже (уверенность int8 на TPU занижена).
# source.uri — относительно edge.data_dir. На сервере это
#   /home/hackathon10864/work/mosprom/data/videos/{s1_01,s2_01,s3_02,s4_02}.mp4
# (заливает tools/stand.py sync-data --videos s1_01,s2_01,s3_02,s4_02); на ноутбуке — data/videos/.
# Полигоны зон — нормированные 0..1 (data/labels/*.json, A5); active_hours: null — всегда.

edge:
  backend: linq-tpu
  models_config: configs/models.stand.yaml   # det/pose 480 и ppe/fire 640 на TPU
  models_dir: ~/work/models                  # программы TPU: ~/work/models/tpu/<имя>/ (+ /auto/cache)
  data_dir: ~/work/mosprom/data_360          # субпоток 640×360 (docs/EDGE.md): декод 0.28 ядра вместо 0.92
  rabbit_url: null                           # на стенде — amqp://…@10.0.114.30:5672/ (RTT 1 мс)
  node_id: stand-linq
  linq: {raw: true, window: 4, timeout_s: 5}  # raw-упаковка на numpy; 4 задачи в полёте; ответ TPU ждём 5 с:
                                             # общий воркер стоит по 2+ с (13 откатов на CPU за час при 2 с),
                                             # а CPU контейнера 4 камеры не тянет (docs/EDGE.md §7.2)
  gateway_guard: {backlog_limit: 300}        # без потребителя очереди шлюза телеметрию не копим
  # preview_max_width 320: превью ~7 КБ, 7 камер × 1 к/с — ~50 КиБ/с из ~110–120 КиБ/с туннеля
  # стенд → ноутбук; остаток — событиям со снимком (docs/EDGE.md §7.1а). При 8 камерах и 384 px
  # возраст превью доходил до 30 с, оповещение — p50 2.9 с от подтверждения (tpu-demo-8cams-*-0629).
  settings: {max_batch: 8, batch_timeout_ms: 4.0, preview_max_width: 320}

cameras:
- camera_id: cam_s1
  name: Цех 1, ограждённый сектор
  site: Цех 1
  source: {type: file, uri: videos/s1_01.mp4, loop: true, realtime: true}
  sample_fps: 4.0
  enabled: true
  zones:
  - zone_id: behind_tape
    name: За ограничительной лентой
    kind: danger
    polygon: [[0.0, 0.3], [0.07, 0.31], [0.4, 0.7], [0.22, 1.0], [0.0, 1.0]]
    active_hours: null
  rules:
  - rule_id: s1_tape
    type: zone_intrusion
    enabled: true
    zones: [behind_tape]
    params: {min_conf: 0.45, min_box_h_px: 40}   # A9: 0.5 на CPU (det 640); int8 на TPU ниже на ~0.05
    min_duration_s: 2.0
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 5.0
    severity: high
- camera_id: cam_s2
  name: Проходная цеха, контроль СИЗ
  site: Цех 2
  source: {type: file, uri: videos/s2_01.mp4, loop: true, realtime: true}
  sample_fps: 4.0
  enabled: true
  zones: []
  rules:
  - rule_id: s2_ppe
    type: ppe_missing
    enabled: true
    zones: null
    params: {required: [helmet], min_box_h_px: 60}
    min_duration_s: 1.5                       # A9
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 10.0
    severity: high
- camera_id: cam_s3
  name: Комната отдыха персонала
  site: АБК
  source: {type: file, uri: videos/s3_02.mp4, loop: true, realtime: true}
  sample_fps: 4.0
  enabled: true
  zones: []
  rules:
  - rule_id: s3_fall
    type: fall_immobile
    enabled: true
    zones: null
    params: {min_lying_s: 1.0, immobile_window_s: 1.5}   # A9
    min_duration_s: 1.0
    min_ratio: 0.5
    close_after_s: 3.0
    cooldown_s: 10.0
    severity: critical
- camera_id: cam_s4
  name: Погрузочная площадка
  site: Склад
  source: {type: file, uri: videos/s4_02.mp4, loop: true, realtime: true}
  sample_fps: 4.0
  enabled: true
  zones: []
  rules:
  - rule_id: s4_vehicle
    type: vehicle_proximity
    enabled: true
    zones: null
    params: {min_vehicle_speed_bh: 0.05}      # A9
    min_duration_s: 1.5
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 10.0
    severity: critical
# Дополнительные сцены для «Мониторинга» (25.10): другие типы нарушений, sample_fps 2–3, у четырёх
# основных камер 4 к/с — CPU контейнера 1.5 ядра, а FileSource декодирует ролик целиком (docs/EDGE.md §7.2).
# Правила — из ml/eval/scenarios.yaml (s6_01, s7_01). Ролик s2_02 (каски) убран: CPU 1.40 ядра при 8 камерах.
- camera_id: cam_s6
  name: Участок сборки, телефон у уха
  site: Цех 3
  source: {type: file, uri: videos/s6_01.mp4, loop: true, realtime: true}
  sample_fps: 3.0
  enabled: true
  zones: []
  rules:
  - rule_id: s6_phone
    type: phone_usage
    enabled: true
    zones: null
    params: {}
    min_duration_s: 1.5
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 10.0
    severity: medium
- camera_id: cam_s7
  name: Неотапливаемый склад, курение и открытый огонь
  site: Склад
  source: {type: file, uri: videos/s7_01.mp4, loop: true, realtime: true}
  sample_fps: 2.0
  enabled: true
  zones: []
  rules:
  - rule_id: s7_smoking
    type: smoking_fire
    enabled: true
    zones: null
    params: {}
    min_duration_s: 1.5
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 10.0
    severity: critical
# Живая трансляция YouTube Live (перекрёсток Сибуя, Токио): люди и машины. Ссылку на страницу
# yt-dlp на edge превращает в HLS 360p при каждом подключении (guard/sources/stream_url.py).
# Без касок и СИЗ: на улице это поток ложных тревог.
- camera_id: cam_live1
  name: Трансляция — перекрёсток Сибуя (Токио)
  site: Город, онлайн
  source: {type: rtsp, uri: "https://www.youtube.com/watch?v=dfVK7ld38Ys", loop: true, realtime: true}
  sample_fps: 2.0
  enabled: true
  zones: []
  rules:
  - rule_id: live1_vehicle
    type: vehicle_proximity
    enabled: true
    zones: null
    params: {min_vehicle_speed_bh: 0.05}
    min_duration_s: 1.5
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 20.0
    severity: high
  - rule_id: live1_running
    type: running
    enabled: true
    zones: null
    params: {min_box_h_px: 30}
    min_duration_s: 1.5
    min_ratio: 0.7
    close_after_s: 3.0
    cooldown_s: 30.0
    severity: medium
