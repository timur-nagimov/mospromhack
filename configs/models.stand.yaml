# Реестр моделей edge-узла на стенде LinQ (A10, D-005). Основной реестр — configs/models.yaml (A2);
# здесь те же model_id и классы, плюс программы TPU и пороги для int8.
#
# onnx_path и tpu_program — относительно GUARD_MODELS_DIR (на стенде ~/work/models, см. секцию edge
# в configs/cameras.stand.yaml). Бэкенд linq-tpu берёт manifest.json рядом с программой и шлёт задачи
# с URI file:///auto/cache/hackathon10864/<имя>.tpu?raw=True, поэтому программа должна лежать и в
# ~/work/models/tpu/<имя>/, и в /auto/cache/hackathon10864/ (docs/EDGE.md, «Подготовка стенда»).
# Бэкенд onnx-cpu (сравнение на CPU) берёт onnx_path — это те же сети до компиляции.
#
# Выбор (docs/LINQ_NOTES.md §13–16): det и pose — 480 (raw ~45 к/с, recall на TPU 0.95–0.97);
# ppe и fire скомпилированы только в 640 (A2, 24.10 09:10). После int8 уверенность ниже на ~0.05,
# поэтому conf для det и ppe снижен на 0.05–0.10 относительно CPU.

models:
  - model_id: det
    task: detect
    onnx_path: yolov8n-480.onnx
    tpu_program: tpu/yolov8n_480/yolov8n_480_b1_o5_h1m.tpu
    input_size: [480, 480]
    input_dtype: float32
    output_format: yolov8
    conf_threshold: 0.25           # TPU: recall 0.95 / precision 0.97 на отложенных кадрах (§16)
    iou_threshold: 0.5
    classes: &coco80 [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light,
      fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow, elephant, bear,
      zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee, skis, snowboard, sports ball,
      kite, baseball bat, baseball glove, skateboard, surfboard, tennis racket, bottle, wine glass, cup,
      fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut,
      cake, chair, couch, potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard,
      cell phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors, teddy bear,
      hair drier, toothbrush]
  - model_id: pose
    task: pose
    onnx_path: yolov8n-pose-480.onnx
    tpu_program: tpu/yolov8n_pose_480/yolov8n_pose_480_b1_o5_h1m.tpu
    input_size: [480, 480]
    input_dtype: float32
    output_format: yolov8-pose
    conf_threshold: 0.3            # pose на TPU почти без недобора conf (Δ −0.02)
    iou_threshold: 0.5
    classes: [person]
  - model_id: ppe
    task: detect
    onnx_path: ppe-640.onnx
    tpu_program: tpu/ppe_640/ppe_640_b1_o5_h1m.tpu
    input_size: [640, 640]
    input_dtype: float32
    output_format: yolov8
    conf_threshold: 0.35           # CPU 0.4; no_helmet/no_vest подтверждаются по треку (ppe_missing)
    iou_threshold: 0.5
    classes: [person, helmet, no_helmet, vest, no_vest, no_mask, gloves, safety_shoes, excavator,
      wheel_loader, dump_truck, goggles, no_goggles, no_gloves]
  - model_id: fire
    task: detect
    onnx_path: fire-640.onnx
    tpu_program: tpu/fire_640s1/fire_640s1_b1_o5_h1m.tpu   # A2: пороги sigmoid, Δconf −0.05 вместо −0.19
    input_size: [640, 640]
    input_dtype: float32
    output_format: yolov8
    conf_threshold: 0.35
    iou_threshold: 0.5
    classes: [smoke, fire]
