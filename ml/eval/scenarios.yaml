# Пути разрешаются относительно root; root — относительно этого YAML.
# camera.source создаётся загрузчиком: file, loop=false, realtime=false.
# camera.rules — полный список включённых правил данного ролика.
#
# Зоны и наборы правил перенесены из data/labels/*.json.
# Параметры подтверждения и параметры плагинов оставлены штатными:
# min_duration_s=2, min_ratio=0.7, close_after_s=3, cooldown_s=30.
# Порогов, подобранных по размеченным интервалам, и сбросов на склейках нет.
#
# Полный прогон требует моделей всех перечисленных плагинов. Реестр только
# с det/pose может быть недостаточен; runner выдаст ошибку до чтения видео.
# Используйте --models-config/--models-dir для полного реестра.
#
# Чистые ролики размечены прежде всего по отсутствию нарушений касочного
# режима. Здесь используются штатные параметры ppe_missing: если плагин
# также проверяет жилеты, его тревоги будут честно учтены как FP.
# Предсказания дополнительных типов не исключаются из оценки.

version: 1
root: ../..
videos_dir: data/videos
labels_dir: data/labels
models_config: configs/models.yaml
models_dir: models
sample_fps: 5.0

# Постоянная эпоха обеспечивает воспроизводимость и независимость от
# скорости машины. У предложенных зон нет ограничений active_hours.
t0: 1700000000.0

scenarios:
  - id: clean_01
    video: clean_01.mp4
    camera:
      camera_id: offline_clean_01
      name: Подстанция — чистый ролик
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: ppe, type: ppe_missing, enabled: true}
        - {rule_id: intrusion, type: zone_intrusion, enabled: true}
        - {rule_id: fall, type: fall_immobile, enabled: true}
        - {rule_id: vehicle, type: vehicle_proximity, enabled: true}

  - id: clean_02
    video: clean_02.mp4
    camera:
      camera_id: offline_clean_02
      name: Рабочие на стройплощадке — чистый ролик
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: ppe, type: ppe_missing, enabled: true}
        - {rule_id: fall, type: fall_immobile, enabled: true}
        - {rule_id: vehicle, type: vehicle_proximity, enabled: true}

  - id: s1_01
    video: s1_01.mp4
    camera:
      camera_id: offline_s1_01
      name: Цех — за ограничительной лентой
      site: Офлайн-разметка
      zones:
        - zone_id: behind_tape
          name: За ограничительной лентой (левый передний сектор)
          kind: danger
          # data/labels/s1_01.json, опорный кадр 11.1 с.
          polygon:
            - [0.0, 0.3]
            - [0.07, 0.31]
            - [0.4, 0.7]
            - [0.22, 1.0]
            - [0.0, 1.0]
      rules:
        - rule_id: intrusion
          type: zone_intrusion
          enabled: true
          zones: [behind_tape]
          params: {min_conf: 0.35, min_box_h_px: 40}
        - {rule_id: ppe, type: ppe_missing, enabled: true}

  - id: s1_02
    video: s1_02.mp4
    camera:
      camera_id: offline_s1_02
      name: Магазин — дальний конец прохода
      site: Офлайн-разметка
      zones:
        - zone_id: aisle_far_right
          name: Дальний конец правого прохода
          kind: danger
          # data/labels/s1_02.json, опорный кадр 3 с.
          polygon:
            - [0.47, 0.22]
            - [0.6, 0.22]
            - [0.75, 0.56]
            - [0.5, 0.56]
      rules:
        - rule_id: intrusion
          type: zone_intrusion
          enabled: true
          zones: [aisle_far_right]
          params: {min_conf: 0.35, min_box_h_px: 30}

  - id: s2_01
    video: s2_01.mp4
    camera:
      camera_id: offline_s2_01
      name: Коридор — каски и жилеты
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: ppe, type: ppe_missing, enabled: true}

  - id: s2_02
    video: s2_02.mp4
    camera:
      camera_id: offline_s2_02
      name: Склад и стройка — отсутствие касок
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: ppe, type: ppe_missing, enabled: true}

  - id: s3_01
    video: s3_01.mp4
    camera:
      camera_id: offline_s3_01
      name: Падение на снегу
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: fall, type: fall_immobile, enabled: true}

  - id: s3_02
    video: s3_02.mp4
    camera:
      camera_id: offline_s3_02
      name: Постановочные падения GMDCSA24
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: fall, type: fall_immobile, enabled: true}

  - id: s4_01
    video: s4_01.mp4
    camera:
      camera_id: offline_s4_01
      name: Рабочий между фурами
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: vehicle, type: vehicle_proximity, enabled: true}
        - {rule_id: ppe, type: ppe_missing, enabled: true}

  - id: s4_02
    video: s4_02.mp4
    camera:
      camera_id: offline_s4_02
      name: Грузовик и погрузчик рядом с рабочим
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: vehicle, type: vehicle_proximity, enabled: true}

  - id: s4_03
    video: s4_03.mp4
    camera:
      camera_id: offline_s4_03
      name: Экскаватор и самосвал в котловане
      site: Офлайн-разметка
      zones:
        - zone_id: excavator_pit
          name: Котлован — радиус работы экскаватора и погрузка
          kind: vehicle_path
          # data/labels/s4_03.json, опорный кадр 5 с.
          polygon:
            - [0.14, 0.0]
            - [0.52, 0.0]
            - [0.56, 1.0]
            - [0.1, 1.0]
      rules:
        - {rule_id: vehicle, type: vehicle_proximity, enabled: true}
        - rule_id: intrusion
          type: zone_intrusion
          enabled: true
          zones: [excavator_pit]

  - id: s6_01
    video: s6_01.mp4
    camera:
      camera_id: offline_s6_01
      name: Телефон у уха
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: phone, type: phone_usage, enabled: true}
        - {rule_id: ppe, type: ppe_missing, enabled: true}

  - id: s7_01
    video: s7_01.mp4
    camera:
      camera_id: offline_s7_01
      name: Курение в заброшенном здании
      site: Офлайн-разметка
      zones: []
      rules:
        - {rule_id: smoking, type: smoking_fire, enabled: true}
