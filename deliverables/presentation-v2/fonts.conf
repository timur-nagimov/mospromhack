<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Каталоги шрифтов для LibreOffice при сборке PDF (build.py передаёт файл через FONTCONFIG_FILE).
     Без него LibreOffice из Homebrew не видит шрифты пользователя и подставляет Linux Libertine. -->
<fontconfig>
  <dir>~/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Applications/LibreOffice.app/Contents/Resources/fonts</dir>
  <cachedir>/tmp/zz-deck-v2-fontconfig-cache</cachedir>
</fontconfig>
