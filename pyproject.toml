[project]
name = "guard"
version = "0.1.0"
description = "Зазеркалье: видеоаналитика нарушений ТБ на LinQ TPU"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy", "opencv-python-headless<4.13", "onnxruntime", "onnx", "fastapi>=0.110", "uvicorn[standard]",
  "pydantic>=2.6", "pyyaml", "pika", "aio-pika", "scipy", "lap", "imageio-ffmpeg", "python-multipart",
  "requests", "websocket-client", "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]
ml = [
  "ultralytics==8.3.221", "torch==2.8.0", "torchvision==0.23.0", "onnxslim==0.1.98",
  "onnx==1.23.2", "onnxruntime==1.31.0", "numpy==2.4.6",
  "opencv-python==4.11.0.86", "opencv-python-headless==4.11.0.86",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
